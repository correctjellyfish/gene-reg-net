[project]
name = "gene-reg-net"
version = "0.1.0"
description = "Tools for working with gene regulatory networks"
readme = "README.md"
authors = [{ name = "Braden Griebel", email = "bgriebel@uw.edu" }]
requires-python = ">=3.10"
dependencies = [
  "networkx>=3.4.2",
  "numpy>=2.2.6",
  "pandas>=2.3.3",
  "scipy>=1.15.3",
]

[project.urls]
Homepage = "https://github.com/correctjellyfish/gene-reg-net"
Repository = "https://github.com/correctjellyfish/gene-reg-net"
Documentation = "https://gene-reg-net.readthedocs.io/en/latest/"
Issues = "https://github.com/correctjellyfish/gene-reg-net/issues"
Changelog = "https://github.com/correctjellyfish/gene-reg-net/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
    "tox>=4.64.9",
    "tox-uv>=1.36.1",
    "ty>=0.0.85",
]
docs = [
  "iplotx>=1.8.0",
  "jupyter>=1.1.1",
  "matplotlib>=3.10.9",
  "nbsphinx>=0.9.8",
  "numpydoc>=1.11.0",
  "sphinx>=8.1.3",
  "sphinx-rtd-theme>=3.1.0",
]
test = [
    "pytest>=9.1.1",
]
