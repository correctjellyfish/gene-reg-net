[project]
name = "gene-reg-net"
version = "0.1.0"
description = "Tools for working with gene regulatory networks"
readme = "README.md"
authors = [
    { name = "Braden Griebel", email = "bgriebel@uw.edu" }
]
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "scipy>=1.15.3",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.85",
]
